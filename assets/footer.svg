<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#02B5FF"/><stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <style>
      .f{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
      .wave{animation:w 8s ease-in-out infinite alternate}
      @keyframes w{to{transform:translateX(-60px)}}
    </style>
  </defs>
  <g class="wave">
    <path d="M0 70 C 150 40, 300 100, 450 70 S 750 40, 960 70 V120 H0Z" fill="url(#g)" opacity="0.25"/>
    <path d="M0 85 C 180 60, 320 110, 480 85 S 780 60, 960 85 V120 H0Z" fill="url(#g)" opacity="0.45"/>
  </g>
  <text x="450" y="40" class="f" font-size="16" text-anchor="middle" fill="#8B98B8">Thanks for stopping by — let's build something that ships.</text>
</svg>
