<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#02B5FF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#02B5FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#02B5FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; white-space: pre; }
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .k { fill: #C792EA; } .v { fill: #82AAFF; } .s { fill: #C3E88D; } .p { fill: #89DDFF; } .c { fill: #546E7A; } .w { fill: #E6EDF3; }
      .ln { opacity: 0; animation: show 0.01s forwards; }
      .l1 { animation-delay: 0.4s; } .l2 { animation-delay: 0.8s; } .l3 { animation-delay: 1.2s; }
      .l4 { animation-delay: 1.6s; } .l5 { animation-delay: 2.0s; } .l6 { animation-delay: 2.4s; }
      .l7 { animation-delay: 2.8s; } .l8 { animation-delay: 3.2s; } .l9 { animation-delay: 3.6s; }
      @keyframes show { to { opacity: 1; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 50% { transform: translateY(-6px); } }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.35; } }
